[project]
name = "agentic-checkout"
version = "0.0.1"
description = "Agentic checkout with authoritative payment resolution"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "backend", "domain"]
